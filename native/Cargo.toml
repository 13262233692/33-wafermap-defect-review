[package]
name = "wafermap-native"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "2", features = ["napi9", "serde-json", "async"] }
napi-derive = "2"
memmap2 = "0.9"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
